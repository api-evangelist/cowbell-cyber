aid: cowbell-cyber
name: Cowbell Cyber
description: >-
  Cowbell is a cyber insurance provider (insurtech) that delivers adaptive,
  continuously-underwritten cyber liability coverage and cyber-risk management
  services to small businesses and the middle market. Its platform pairs
  insurance products with proprietary risk analytics — Cowbell Factors, a
  continuous risk-rating model that benchmarks an organization's exposure
  against peers — and closed-loop resilience services delivered through the
  Cowbell console for policyholders, agents, and brokers. Product lines include
  Cowbell Prime 100 / Prime 100 Pro (small business), Prime 250 / Prime One
  (middle market), Prime Plus (excess), Technology Errors & Omissions,
  Management Liability, plus the Cowbell Rx marketplace, Cowbell Connectors,
  and Cowbell Insights. The company was surfaced as a portfolio company of
  Anthemis and added to the API Evangelist network. As of this enrichment pass
  Cowbell publishes no public developer API, OpenAPI, or developer portal — the
  console at console.cowbellcyber.ai is an authenticated quoting/policy
  application for agents and insureds, not a documented programmatic API.
